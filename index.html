<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitCircle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ================================================================
   FITCIRCLE — design system
   Palette sampled from the reference: screen #EBF0FC, cards white,
   primary #5C85D9, pale blue #CDDEFE, yellow #F2EBB4, peach #F4D0BC.
   Class names are unchanged from the previous build so all logic
   and tests still apply.
   ================================================================ */
:root{
  --bg:#EBF0FC; --bg-outer:#E2E7F3; --card:#FFFFFF;
  --blue:#5C85D9; --blue-d:#4B73C6; --blue-s:#EEF3FE;
  --pale:#CDDEFE; --track:#F5F8FE; --yellow:#F2EBB4; --peach:#F4D0BC;
  --text:#1B1F2E; --muted:#8A93A8; --line:#E3E8F3;
  --green:#22B573; --red:#E5484D;
  --r-card:24px; --r-inner:18px; --r-btn:16px; --r-pill:999px;
  --shadow:0 10px 30px rgba(92,133,217,.12);
  --shadow-s:0 4px 14px rgba(27,31,46,.06);

  /* aliases the templates already use */
  --ink:var(--bg); --raise:var(--card); --deep:var(--track); --bone:var(--text);
  --slate:var(--muted); --amber:var(--blue); --teal:var(--blue);

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#12161C; --bg-outer:#0D1116; --card:#1A212A; --blue:#7DA0EA; --blue-d:#5C85D9; --blue-s:#1E2A3D;
  --pale:#233149; --track:#0D1116; --yellow:#5E5A2E; --peach:#5C3F33;
  --text:#E6E2D9; --muted:#8B95A5; --line:#232B36; --green:#4FB8A0;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-s:0 4px 14px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  font-feature-settings:'cv11','ss01';
}
.wrap{max-width:900px; margin:0 auto; padding:22px 20px 60px}
h1,h2,h3,h4{margin:0; letter-spacing:-0.02em; font-weight:700}
p{margin:0}
button{font:inherit; cursor:pointer}
a{color:var(--blue)}
.hidden{display:none !important}
.sronly{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- sign-in gate ---------- */
#gate{min-height:80vh; display:flex; flex-direction:column; justify-content:center; max-width:460px; margin:0 auto; padding:26px 22px}
.gate-mark{font-size:42px; font-weight:800; letter-spacing:-0.04em; line-height:1; color:var(--text)}
.gate-sub{color:var(--muted); margin-top:12px; font-size:15.5px}
.gate-note{color:var(--muted); font-size:13px; margin-top:26px}

/* ---------- buttons ---------- */
.btn{background:var(--blue); color:#fff; border:none; padding:14px 26px; border-radius:var(--r-pill);
  font-weight:600; font-size:15px; min-height:52px; box-shadow:0 8px 20px rgba(92,133,217,.28)}
.btn:hover{background:var(--blue-d)}
.ghost{background:var(--card); border:1px solid var(--line); color:var(--text);
  padding:10px 16px; border-radius:var(--r-pill); font-size:13.5px; font-weight:500; min-height:42px}
.ghost:hover{border-color:var(--blue); color:var(--blue)}
a.ghost,label.ghost{display:inline-flex; align-items:center; text-decoration:none; cursor:pointer}
label.ghost:hover{border-color:var(--blue); color:var(--blue)}
.tiny{background:none; border:none; color:var(--muted); font-size:12.5px; padding:0; font-weight:500}
.tiny:hover{color:var(--blue)}
.btn:focus-visible,.ghost:focus-visible,.chip:focus-visible,.setbtn:focus-visible,.pdot:focus-visible,
input:focus-visible,select:focus-visible,.tabs button:focus-visible,.bnav button:focus-visible{
  outline:3px solid rgba(92,133,217,.45); outline-offset:2px}

.dim{color:var(--muted); font-weight:400; font-size:13.5px}
.caption{color:var(--muted); font-size:12.5px; margin-top:10px; max-width:68ch}
.hint{color:var(--muted); font-size:13px; margin-top:14px; max-width:74ch}
.rule{border:0; border-top:1px solid var(--line); margin:0}
.good{color:var(--green); font-size:13px; font-weight:600}
.short{color:var(--blue); font-size:13px; font-weight:600}
.status{color:var(--green); font-size:13.5px; min-height:18px; font-weight:500}
.status.err{color:var(--red)}

/* ---------- header ---------- */
.top{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap}
.topid{display:flex; align-items:center; gap:12px; min-width:0}
.avatar{width:50px; height:50px; border-radius:50%; background:var(--pale); color:var(--blue-d);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex:0 0 auto}
.topname{min-width:0}
.who,.hero2greet{color:var(--muted); font-size:13px}
.whoname{font-size:19px; font-weight:700; letter-spacing:-0.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topright{display:flex; align-items:center; gap:12px}
.streak{display:inline-flex; align-items:center; gap:7px; background:var(--card); border-radius:var(--r-pill);
  padding:8px 14px 8px 10px; color:var(--muted); box-shadow:var(--shadow-s); min-height:42px}
.streak svg{width:20px; height:20px; fill:currentColor}
.streak.lit{color:var(--blue)}
.streak b{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text)}
.streak span{display:none}
.tabs{display:flex; gap:6px; background:var(--card); padding:5px; border-radius:var(--r-pill); box-shadow:var(--shadow-s)}
.tabs button{background:transparent; border:none; color:var(--muted); font-size:14px; font-weight:500;
  padding:8px 16px; border-radius:var(--r-pill); min-height:40px}
.tabs button.on{background:var(--blue); color:#fff}

/* ---------- workout hero card ---------- */
.hero2{position:relative; display:flex; justify-content:space-between; align-items:flex-end; gap:18px;
  margin-top:22px; padding:22px 22px 20px; border-radius:var(--r-card);
  background:linear-gradient(135deg,#D7E3FF 0%,#CDDEFE 60%,#C3D6FB 100%); overflow:hidden}
.hero2::after{content:""; position:absolute; right:-40px; top:-50px; width:200px; height:200px; border-radius:50%;
  background:rgba(255,255,255,.35); pointer-events:none; z-index:0}
.hero2main{min-width:0; flex:1 1 auto; position:relative; z-index:1}
.hero2meta{color:var(--blue-d); font-size:12.5px; font-weight:600; letter-spacing:.01em}
.hero2line{font-size:clamp(20px,4.6vw,27px); font-weight:800; letter-spacing:-0.03em; line-height:1.15; margin-top:8px; max-width:24ch; color:var(--text)}
.hero2go{position:relative; z-index:1; flex:0 0 auto; width:58px; height:58px; border-radius:50%; border:none;
  background:var(--blue); color:#fff; box-shadow:0 8px 18px rgba(92,133,217,.35); display:flex; align-items:center; justify-content:center}
.hero2go svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.hero2go:hover{background:var(--blue-d)}
.strip{display:flex; gap:6px; margin-top:16px}
.strip i{width:11px; height:11px; border-radius:50%; border:1.5px solid rgba(92,133,217,.35); display:block; background:rgba(255,255,255,.6)}
.strip i.trained{background:var(--blue); border-color:var(--blue)}
.strip i.missed{border-color:var(--red); background:rgba(255,255,255,.6)}
.strip i.rest{background:rgba(255,255,255,.35); border-color:transparent}
.strip i.today{border-color:var(--blue); background:#fff; box-shadow:inset 0 0 0 2px #fff, 0 0 0 2px rgba(92,133,217,.25)}

/* ---------- day picker ---------- */
.daypick{display:flex; gap:7px; margin-top:18px; flex-wrap:wrap}
.chip{position:relative; background:var(--card); border:none; color:var(--muted);
  padding:10px 15px; border-radius:var(--r-pill); font-size:14px; font-weight:500; min-height:44px; box-shadow:var(--shadow-s)}
.chip.today{color:var(--text)}
.chip.on{background:var(--blue); color:#fff; font-weight:600}
.chip.rest{opacity:.55}
.daypick.week7{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.daypick.week7 .chip{padding:10px 4px; text-align:center; font-size:13.5px}
.cdot{position:absolute; left:50%; bottom:6px; transform:translateX(-50%); width:5px; height:5px; border-radius:50%}
.cdot.trained{background:var(--blue)}
.cdot.missed{background:var(--red)}
.cdot.today{background:var(--blue)}
.cdot.rest{background:transparent}
.chip.on .cdot{background:#fff}

/* ---------- session card ---------- */
.session{margin-top:18px; padding:22px; border-radius:var(--r-card); background:var(--card); box-shadow:var(--shadow-s)}
.sesshead{display:flex; justify-content:space-between; align-items:center; gap:18px}
.eyebrow{color:var(--blue); font-size:12.5px; font-weight:600}
.weekflip{background:none; border:none; color:var(--muted); font:inherit; font-size:12.5px; text-decoration:underline; padding:2px 4px; min-height:28px}
.sessname{font-size:clamp(22px,5.5vw,28px); font-weight:800; letter-spacing:-0.03em; margin-top:2px}
.sessfocus{color:var(--muted); font-size:14px; margin-top:6px}
.sessnote{color:#4A5266; font-size:14.5px; margin-top:14px; max-width:68ch}
.deloadtag{display:inline-block; margin-left:8px; padding:3px 10px; border-radius:var(--r-pill); font-size:11.5px; font-weight:600;
  background:var(--yellow); color:#6B6220}
.ring{position:relative; width:78px; height:78px; flex:0 0 auto}
.ring circle{fill:none; stroke-width:7; stroke-linecap:round}
.ring .bg{stroke:var(--pale)}
.ring .fg{stroke:var(--blue); transform:rotate(-90deg); transform-origin:40px 40px}
.ringnum{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums}
.ringnum i{font-style:normal; color:var(--muted); font-size:12px; font-weight:500}
.actions{display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap}

/* ---------- inline timer (list view) ---------- */
.timerbar{position:sticky; top:calc(8px + env(safe-area-inset-top,0px)); z-index:20; margin-top:16px; padding:16px 18px 18px;
  border-radius:var(--r-inner); background:var(--card); box-shadow:var(--shadow);
  display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:16px}
.timerbar.work{background:var(--pale)}
.timerinfo{display:flex; flex-direction:column; min-width:0}
.timerlabel{font-size:12.5px; color:var(--muted); font-weight:600}
.timerbar.work .timerlabel,.timerbar.rest .timerlabel{color:var(--blue-d)}
.timerex{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.timernum{font-size:clamp(34px,9vw,44px); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.03em; line-height:1}
.timeract{display:flex; gap:8px}
.timertrack{grid-column:1/-1; height:6px; background:rgba(92,133,217,.18); border-radius:3px; overflow:hidden}
.timerfill{height:100%; background:var(--blue); border-radius:3px}

/* ---------- exercise cards ---------- */
.phase{padding:20px 0 4px}
.phasename{font-size:16px; font-weight:700; margin-bottom:12px; letter-spacing:-0.01em}
.ex{background:var(--card); border-radius:var(--r-card); padding:14px; margin-bottom:12px; box-shadow:var(--shadow-s);
  display:flex; justify-content:space-between; align-items:flex-start; gap:16px}
.exshot{position:relative; flex:0 0 auto; width:96px; height:84px; padding:0; border:none;
  border-radius:var(--r-inner); overflow:hidden; background:var(--pale); cursor:zoom-in}
.exshot img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; mix-blend-mode:multiply}
.exshot img.b{opacity:0}
@media (prefers-reduced-motion:no-preference){ .exshot img.b{animation:exflip 2.8s ease-in-out infinite} }
@keyframes exflip{0%,38%{opacity:0}52%,88%{opacity:1}100%{opacity:0}}
.exmain{min-width:0; flex:1 1 auto; padding-top:2px}
.ex h4{font-size:16.5px; font-weight:700; letter-spacing:-0.01em}
.exmeta{color:var(--blue-d); font-size:13.5px; margin-top:3px; font-weight:500; font-variant-numeric:tabular-nums}
.excue{color:var(--muted); font-size:13px; margin-top:6px; max-width:58ch}
.sets{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:264px; flex:0 0 auto}
.setbtn{min-width:50px; min-height:46px; padding:0 10px; border-radius:14px; background:var(--track);
  border:1px solid var(--line); color:var(--muted); font-size:14px; font-weight:600; font-variant-numeric:tabular-nums}
.setbtn.done{background:var(--blue); border-color:var(--blue); color:#fff; font-size:17px}
.setbtn.active{border-color:var(--blue); color:var(--blue); background:var(--blue-s)}

.finish{padding:6px 0 22px; display:flex; flex-wrap:wrap; align-items:center; gap:14px}
.finish .hint{flex-basis:100%; margin-top:0}
.next{padding:22px; margin-top:6px; border-radius:var(--r-card); background:var(--pale)}
.next h3{font-size:12.5px; color:var(--blue-d); font-weight:600; margin-bottom:4px}
.nextname{font-size:21px; font-weight:800; letter-spacing:-0.02em}
.nextlist{list-style:none; padding:0; margin-top:12px}
.nextlist li{padding:7px 0; border-bottom:1px solid rgba(92,133,217,.18); font-size:14.5px; font-weight:500}
.nextlist li:last-child{border-bottom:0}
footer{color:var(--muted); font-size:12.5px; padding-top:22px; max-width:76ch}

/* ---------- ledger ---------- */
.hero{display:flex; gap:26px; margin-top:18px; padding:24px; border-radius:var(--r-card); background:var(--card); box-shadow:var(--shadow-s)}
.tank{flex:0 0 auto}
.tank .bg{fill:var(--track)}
.tank .fill{fill:var(--blue); opacity:.9}
.tank .frame{fill:none; stroke:var(--line); stroke-width:1.5}
.tank .tick{stroke:var(--card); stroke-width:1.5; opacity:.8}
.tank text{fill:var(--muted); font-size:10px}
.readout{flex:1 1 auto; min-width:0}
.route{display:flex; align-items:baseline; gap:8px; margin-bottom:10px}
.route b{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums}
.route span{color:var(--muted); font-size:13px}
.big{font-size:clamp(42px,11vw,60px); font-weight:800; letter-spacing:-0.045em; line-height:.94; font-variant-numeric:tabular-nums}
.big i{font-style:normal; font-size:22px; font-weight:500; color:var(--muted); margin-left:8px; letter-spacing:0}
.bigcap{color:var(--muted); margin:8px 0 18px; font-size:14px}
.bar{height:8px; background:var(--track); border-radius:4px; overflow:hidden}
.barfill{height:100%; background:var(--blue); border-radius:4px}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:16px 20px; margin:20px 0 0}
.facts dt{color:var(--muted); font-size:12.5px; margin-bottom:3px}
.facts dd{margin:0; font-size:18px; font-weight:700; font-variant-numeric:tabular-nums}
.eta{margin-top:18px; font-size:14.5px; color:#4A5266; max-width:62ch}
.eta b{color:var(--blue-d); font-weight:700}
.adh{margin-top:16px; color:var(--muted); font-size:13px; max-width:62ch}
.adhbar{display:block; height:6px; background:var(--track); border-radius:3px; overflow:hidden; margin-bottom:9px}
.adhbar>span{display:block; height:100%; background:var(--blue); border-radius:3px}

.wow{margin-top:14px; padding:22px; border-radius:var(--r-card); background:var(--card); box-shadow:var(--shadow-s)}
.wowhead{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.wowhead h3{font-size:16px; font-weight:700}
.wowstreak{color:var(--blue); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
.wowgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:14px 18px; margin:0}
.wowgrid>div{background:var(--track); border-radius:var(--r-inner); padding:12px 14px}
.wowgrid>div:nth-child(3){background:var(--yellow)}
.wowgrid>div:nth-child(4){background:var(--peach)}
.wowgrid>div:nth-child(1){background:var(--pale)}
.wowgrid dt{color:#4A5266; font-size:12px; font-weight:500}
.wowgrid dd{margin:3px 0 0; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums}
.wowgrid dd i{font-style:normal; font-size:12.5px; font-weight:500; color:#4A5266}
.wowgrid p{font-size:13px; margin-top:2px}

.block{margin-top:14px; padding:22px; border-radius:var(--r-card); background:var(--card); box-shadow:var(--shadow-s)}
.blockhead{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px}
.blockhead h2{font-size:17px; font-weight:700}
.todaystat{display:flex; align-items:baseline; gap:7px; font-size:14px; font-variant-numeric:tabular-nums}
.todaystat b{font-size:20px; font-weight:800}

.fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px}
.fields label{display:flex; flex-direction:column; gap:6px; min-width:0}
.fields label.wide{grid-column:1/-1}
.fields span{color:var(--muted); font-size:12.5px; font-weight:500}
.fields input,.fields select{background:var(--track); border:1px solid var(--line); color:var(--text);
  padding:12px 14px; border-radius:14px; font:inherit; font-size:16px; width:100%; min-height:48px; font-variant-numeric:tabular-nums}
.fields input::placeholder{color:#B4BBCC}
.fields input:focus,.fields select:focus{background:var(--card); border-color:var(--blue)}

.checks{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.checks button{background:var(--track); border:1px solid var(--line); color:var(--text);
  padding:10px 16px; border-radius:var(--r-pill); font-size:14px; font-weight:500; min-height:44px}
.checks button.on{background:var(--blue); border-color:var(--blue); color:#fff}

.charts{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; margin-top:14px}
.chart{padding:22px; border-radius:var(--r-card); background:var(--card); box-shadow:var(--shadow-s)}
.chart h3{font-size:16px; font-weight:700; margin-bottom:14px}
.chart svg{width:100%; height:auto; display:block}
.grid{stroke:var(--line); stroke-width:1}
.axis{fill:var(--muted); font-size:10px}
.dot{fill:#B9C8EA}
.trend{fill:none; stroke:var(--blue); stroke-width:2.5; stroke-linejoin:round}
.goal{stroke:var(--green); stroke-dasharray:4 4; stroke-width:1.5}
.cumarea{fill:var(--blue); opacity:.14}
.cumline{fill:none; stroke:var(--blue); stroke-width:2.5; stroke-linejoin:round}
.planline{fill:none; stroke:var(--muted); stroke-width:1.5; stroke-dasharray:5 5}

table{width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums}
th{text-align:left; color:var(--muted); font-weight:600; font-size:12px; padding:0 10px 8px 0; border-bottom:1px solid var(--line)}
td{padding:10px 10px 10px 0; border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}

.tip{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-size:13px}

/* ---------- lightbox ---------- */
.lightbox{position:fixed; inset:0; z-index:60; background:rgba(27,31,46,.55); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; padding:24px; cursor:zoom-out}
.lbinner{max-width:900px; width:100%; text-align:center; background:var(--card); border-radius:var(--r-card); padding:22px; box-shadow:var(--shadow)}
.lbinner h4{font-size:19px; font-weight:700; margin-bottom:16px}
.lbshots{display:flex; gap:16px; justify-content:center; flex-wrap:wrap}
.lbshots figure{margin:0; flex:1 1 300px; max-width:420px}
.lbshots img{width:100%; height:auto; border-radius:var(--r-inner); display:block; background:var(--pale)}
.lbshots figcaption{color:var(--muted); font-size:12.5px; margin-top:8px}
.lbinner .ghost{margin-top:20px}

/* ---------- bottom navigation ---------- */
.bnav{position:fixed; left:14px; right:14px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:40;
  display:none; gap:8px; align-items:center; padding:10px; border-radius:var(--r-pill);
  background:var(--card); box-shadow:0 12px 34px rgba(27,31,46,.14)}
.bnav button{display:flex; align-items:center; justify-content:center; gap:8px; background:var(--blue); border:none; color:#fff;
  width:56px; height:56px; border-radius:50%; font-size:14px; font-weight:600; padding:0; flex:0 0 auto; transition:width .2s ease, border-radius .2s ease}
.bnav button svg{width:22px; height:22px; flex:0 0 auto}
.bnav button span{display:none}
.bnav button.on{flex:1 1 auto; width:auto; border-radius:var(--r-pill); padding:0 18px; justify-content:center}
.bnav button.on span{display:inline}
.bnav button:active{background:var(--blue-d)}

/* ---------- session player ---------- */
.player{position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); overscroll-behavior:contain}
.pbar{display:flex; align-items:center; gap:14px; padding:14px 16px; flex:0 0 auto}
.picon{background:var(--card); border:none; color:var(--text); width:44px; height:44px; border-radius:50%; font-size:15px; line-height:1; flex:0 0 auto; box-shadow:var(--shadow-s)}
.pprog{flex:1 1 auto; height:6px; background:rgba(92,133,217,.18); border-radius:3px; overflow:hidden}
.pprogfill{height:100%; background:var(--blue); border-radius:3px; transition:width .35s ease}
.pcount{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; flex:0 0 auto}
.pcount i{font-style:normal; color:var(--muted); font-weight:500; font-size:12px}

.pstage{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:4px 16px 0}
.pshot{position:relative; margin:0; width:100%; height:100%; border-radius:var(--r-card); overflow:hidden; background:var(--card); box-shadow:var(--shadow-s)}
.pshot img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:var(--card)}
.pshot img.b{opacity:0}
@media (prefers-reduced-motion:no-preference){ .pshot img.b{animation:exflip 2.8s ease-in-out infinite} }
.pshot figcaption{position:absolute; left:0; right:0; bottom:0; padding:10px; text-align:center; font-size:11.5px; color:var(--muted);
  background:linear-gradient(transparent,rgba(255,255,255,.9))}
.pstage.noimg .pshot{display:none}
.pglyph{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; width:100%; height:100%;
  border-radius:var(--r-card); background:var(--pale); padding:24px}
.pglyph span{color:var(--blue-d); font-size:12.5px; font-weight:600}
.pglyph strong{font-size:clamp(22px,5vw,38px); font-weight:800; letter-spacing:-0.03em; line-height:1.05}

.ppanel{flex:0 0 auto; padding:18px 18px 20px; display:flex; flex-direction:column; gap:10px;
  background:var(--card); border-radius:var(--r-card) var(--r-card) 0 0; box-shadow:0 -10px 30px rgba(27,31,46,.06)}
.pphase{color:var(--muted); font-size:12.5px; font-weight:500}
.pname{font-size:clamp(21px,5.2vw,30px); font-weight:800; letter-spacing:-0.03em; line-height:1.1}
.pmeta{color:var(--blue-d); font-size:15px; font-weight:500; font-variant-numeric:tabular-nums}
.pcue{color:#4A5266; font-size:14.5px; max-width:60ch}
.pdots{display:flex; gap:9px; flex-wrap:wrap}
.pdot{width:44px; height:44px; border-radius:14px; background:var(--track); border:1px solid var(--line); color:var(--muted); font-size:14px; font-weight:600; font-variant-numeric:tabular-nums}
.pdot.on{background:var(--blue); border-color:var(--blue); color:#fff; font-size:17px}
.pdot.live{border-color:var(--blue); color:var(--blue); background:var(--blue-s)}

.plog{border-radius:var(--r-inner); padding:14px; background:var(--track); border:1px solid var(--line)}
.plog.pr{border-color:var(--green); background:#EEF9F3}
.prflag{color:var(--green); font-weight:700; font-size:14px; margin-bottom:10px}
@media (prefers-reduced-motion:no-preference){
  .plog.pr{animation:prpulse .6s ease-out}
  @keyframes prpulse{0%{box-shadow:0 0 0 0 rgba(34,181,115,.45)}100%{box-shadow:0 0 0 12px rgba(34,181,115,0)}}
}
.plogrow{display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap}
.plogrow label{display:flex; flex-direction:column; gap:5px}
.plogrow span{color:var(--muted); font-size:12px; font-weight:500}
.plogin{width:96px; min-height:50px; padding:10px 12px; border-radius:14px; font:inherit; font-size:18px; font-weight:600;
  font-variant-numeric:tabular-nums; background:var(--card); border:1px solid var(--line); color:var(--text)}
.plogx{color:var(--muted); font-size:18px; padding-bottom:13px}
.plogset{color:var(--muted); font-size:12.5px; padding-bottom:15px; margin-left:auto}
.plast{color:var(--muted); font-size:13px; margin-top:10px; line-height:1.45}
.plast strong{color:var(--blue-d); font-weight:700}

.ptimer{margin-top:4px}
.plabel{font-size:12.5px; color:var(--muted); font-weight:600}
.ptimer.work .plabel,.ptimer.rest .plabel{color:var(--blue-d)}
.ptime{font-size:clamp(52px,15vw,84px); font-weight:800; letter-spacing:-0.045em; line-height:.92; font-variant-numeric:tabular-nums}
.ptrack{height:6px; background:rgba(92,133,217,.18); border-radius:3px; overflow:hidden; margin-top:8px}
.ptrackfill{height:100%; background:var(--blue); border-radius:3px}

.pactions{display:flex; gap:10px; align-items:stretch; margin-top:6px}
.pnav{flex:0 0 58px; background:var(--track); border:1px solid var(--line); color:var(--text); border-radius:var(--r-pill); font-size:24px; line-height:1; min-height:60px}
.pnav:disabled{opacity:.3}
.pgo{flex:1 1 auto; min-height:60px; border:none; border-radius:var(--r-pill); font-weight:700; font-size:17px; background:var(--blue); color:#fff; box-shadow:0 8px 20px rgba(92,133,217,.28)}
.pgo.quiet{background:var(--track); border:1px solid var(--line); color:var(--text); box-shadow:none}
.pgo.done{background:var(--green); box-shadow:0 8px 20px rgba(34,181,115,.28)}
.pnext{color:var(--muted); font-size:13px}

/* ---------- completion screen ---------- */
.doneshell{position:fixed; inset:0; z-index:70; background:var(--bg); overflow-y:auto; display:flex; align-items:center; justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px))}
.done{max-width:520px; width:100%; text-align:center; background:var(--card); border-radius:var(--r-card); padding:32px 24px; box-shadow:var(--shadow)}
.donering{width:104px; height:104px; margin:0 auto 18px}
.donering svg{width:100%; height:100%}
.donering circle{fill:none; stroke:var(--blue); stroke-width:6; stroke-dasharray:327; stroke-dashoffset:327}
.donering path{fill:none; stroke:var(--blue); stroke-width:6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:70; stroke-dashoffset:70}
@media (prefers-reduced-motion:no-preference){
  .donering circle{animation:ringdraw .7s ease-out forwards}
  .donering path{animation:tickdraw .35s ease-out .55s forwards}
  @keyframes ringdraw{to{stroke-dashoffset:0}}
  @keyframes tickdraw{to{stroke-dashoffset:0}}
}
@media (prefers-reduced-motion:reduce){ .donering circle,.donering path{stroke-dashoffset:0} }
.done h2{font-size:clamp(28px,8vw,40px); font-weight:800; letter-spacing:-0.04em; margin-top:4px}
.donefacts{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:24px 0 0}
.donefacts>div{background:var(--track); border-radius:var(--r-inner); padding:12px 8px}
.donefacts>div:nth-child(1){background:var(--pale)}
.donefacts>div:nth-child(3){background:var(--yellow)}
.donefacts>div:nth-child(4){background:var(--peach)}
.donefacts dt{color:#4A5266; font-size:12px; font-weight:500}
.donefacts dd{margin:3px 0 0; font-size:22px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums}
.donefacts i{font-style:normal; font-size:12.5px; font-weight:500; color:#4A5266}
.doneprs{margin-top:22px; padding:16px; border-radius:var(--r-inner); background:#EEF9F3; text-align:left}
.donelabel{color:var(--green); font-size:12.5px; font-weight:700; margin-bottom:8px}
.donepr{font-size:14.5px; padding:4px 0}
.donehits{margin-top:18px}
.donehits p{color:var(--blue-d); font-weight:700; font-size:15px; padding:3px 0}
.donefoot{color:var(--muted); font-size:14px; margin-top:16px}
.donefoot strong{color:var(--text); font-weight:700}
.done .btn{margin-top:24px; min-width:180px}

/* ================================================================
   RESPONSIVE
   ================================================================ */
@media (max-width:700px){
  .bnav{display:flex}
  .tabs{display:none}
  .wrap{padding:16px 14px calc(104px + env(safe-area-inset-bottom,0px))}
  .top{gap:12px}
  .ex{display:grid; grid-template-columns:auto 1fr; grid-template-areas:"shot main" "sets sets"; gap:12px 14px; align-items:start}
  .exshot{grid-area:shot; width:84px; height:72px}
  .exmain{grid-area:main; min-width:0}
  .sets{grid-area:sets; max-width:none; display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}
  .setbtn{width:100%}
  .timerbar{grid-template-columns:1fr auto}
  .timeract{grid-column:1/-1}
  .blockhead{align-items:flex-start}
  .donefacts{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:780px){
  .hero{flex-direction:row; align-items:flex-start; gap:18px}
  .tank svg{width:66px; height:166px}
  .readout{width:auto}
}
@media (max-width:430px){
  .wrap{padding-left:12px; padding-right:12px}
  .fields{grid-template-columns:1fr 1fr}
  .fields label.wide,.fields label:first-child{grid-column:1/-1}
  .facts{grid-template-columns:1fr 1fr; gap:14px}
  .exshot{width:72px; height:64px}
  .avatar{width:44px; height:44px}
}
@media (min-width:701px) and (max-width:1023px){
  .wrap{padding:26px 24px 72px}
  .fields{grid-template-columns:repeat(3,1fr)}
  .charts{grid-template-columns:1fr}
}
@media (min-width:1024px){
  .wrap{max-width:1040px; padding:32px 32px 80px}
  .fields{grid-template-columns:repeat(4,1fr)}
  .fields label.wide{grid-column:1/-1}
  .ex{gap:20px}
  .exshot{width:112px; height:92px}
}
@media (min-width:1440px){ .wrap{max-width:1180px} .exshot{width:128px; height:104px} }

/* player: tablet, desktop, any phone sideways */
@media (min-width:720px), (orientation:landscape) and (min-height:320px){
  .player{display:grid; grid-template-columns:1fr minmax(320px,440px); grid-template-rows:auto 1fr; column-gap:20px; padding-left:18px; padding-right:18px}
  .pbar{grid-column:1/-1}
  .pstage{padding:0 0 18px}
  .ppanel{padding:22px; border-radius:var(--r-card); margin-bottom:18px; overflow-y:auto; justify-content:center}
}
@media (min-width:1100px){ .player{grid-template-columns:1fr 460px; padding-left:40px; padding-right:40px} .ppanel{gap:13px} }

@media (prefers-reduced-motion:no-preference){ .barfill,.ring .fg{transition:all .4s ease} }
</style>

/* ---------------- helpers ---------------- */
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>isoOf(new Date());
const parseISO=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const shortDate=s=>{const d=parseISO(s);return `${d.getDate()} ${MONTHS[d.getMonth()]}`};
const longDate=d=>`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);
const fmt=n=>Math.round(n||0).toLocaleString('en-IN');
const clock=s=>{const t=Math.max(0,Math.ceil(s));return `${Math.floor(t/60)}:${pad(t%60)}`};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* Two frames per exercise — start and end position — served from jsDelivr,
   which is built for exactly this. Nothing to host. If the lookup file or an
   image fails to load, the app carries on without pictures. */
const IMG_CDN='https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/exercises/';
let IMG_MAP=null;

const normName=s=>String(s||'').toLowerCase().replace(/-/g,' ')
  .replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).join(' ');

/* Only strip words that describe how it's loaded or counted, never the movement. */
const TRIM=[/ without weight$/,/ to failure$/,/ each leg$/,/ each side$/,/^alternating /,/^bodyweight /];

function exerciseShot(name){
  if(!IMG_MAP) return null;
  let q=normName(name);
  if(IMG_MAP[q]) return IMG_MAP[q];
  for(const re of TRIM){
    const t=q.replace(re,'').trim();
    if(t && t!==q && IMG_MAP[t]) return IMG_MAP[t];
  }
  return null;
}

function shotHtml(name){
  const folder=exerciseShot(name);
  if(!folder) return '';
  const enc=encodeURIComponent(folder);
  return `<button class="exshot" data-act="zoom" data-folder="${esc(folder)}" data-name="${esc(name)}" aria-label="Show ${esc(name)}">
    <img src="${IMG_CDN}${enc}/0.jpg" alt="" loading="lazy" onerror="this.parentNode.style.display='none'">
    <img class="b" src="${IMG_CDN}${enc}/1.jpg" alt="" loading="lazy" onerror="this.style.display='none'">
  </button>`;
}

async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wakeLock){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{wakeLock=null;});
    }else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ /* unsupported or refused — the player still works */ }
}
document.addEventListener('visibilitychange',()=>{
  if(player && document.visibilityState==='visible') keepAwake(true);
});

function openPlayer(exIdx){
  player={ex:exIdx||0};

  player=null; keepAwake(false);

  for(let i=0;i<ses.exercises.length;i++){

    for(let s=0;s<ex.sets;s++) if(!done[setKey(ex.name,s)]) return i;
  }
  return 0;
}
function nextSetIndex(ex, exIdx, done){
  for(let s=0;s<ex.sets;s++) if(!done[setKey(ex.name,s)]) return s;
  return ex.sets;
}

/* ================================================================
   LOAD LOGGING, PROGRESSION, ADHERENCE
   Logs are keyed by exercise NAME, not position, so they survive a
   plan change. sessions[date].log = { "Barbell row": [{w,r},...] }
   ================================================================ */
function sessionLog(iso){ return (S.sessions[iso] && S.sessions[iso].log) || {}; }

/* Ticks are keyed by exercise NAME too. A plan change (upload, new equipment,
   different days) reorders exercises; a tick must follow the exercise, not the slot. */
const setKey=(name,s)=>`${name}::${s}`;

function migrateDoneKeys(){
  const iso=todayISO(), rec=S.sessions[iso];
  if(!rec || !rec.done || !S.profile) return;
  const legacy=Object.keys(rec.done).filter(k=>/^\d+-\d+$/.test(k));
  if(!legacy.length) return;
  const ses=buildSession(S.profile, new Date().getDay());
  legacy.forEach(k=>{
    const [i,st]=k.split('-').map(Number);
    delete rec.done[k];
    const ex=ses.exercises[i];
    if(ex) rec.done[setKey(ex.name,st)]=true;
  });
}

function recordSet(iso, name, setIdx, patch){
  const cur=S.sessions[iso] || {done:{}};
  if(!cur.log) cur.log={};
  if(!cur.log[name]) cur.log[name]=[];
  const row=cur.log[name][setIdx] || {};
  if(patch.w!==undefined) row.w = patch.w===''?null:Number(patch.w);
  if(patch.r!==undefined) row.r = patch.r===''?null:Number(patch.r);
  if(row.w==null && row.r==null) cur.log[name][setIdx]=null; else cur.log[name][setIdx]=row;
  S.sessions[iso]=cur;
  queueSave();
}

/** The most recent day before `iso` on which this exercise was actually logged. */
function lastPerformance(name, iso){
  const dates=Object.keys(S.sessions).filter(d=>d<iso).sort().reverse();
  for(const d of dates){
    const rows=(S.sessions[d].log||{})[name];
    if(rows && rows.some(x=>x && (x.r||x.w))) return {date:d, sets:rows.filter(Boolean)};
  }
  return null;
}

const setVolume = s => (Number(s.w)||0)*(Number(s.r)||0);
function topSet(sets){
  let best=null;
  for(const s of sets){ if(!s) continue; if(!best || setVolume(s)>setVolume(best) || (!best.w&&(s.r||0)>(best.r||0))) best=s; }
  return best;
}
const describeSet = s => s ? (s.w ? `${s.w} kg × ${s.r||'?'}` : `${s.r||'?'} reps`) : '';

/** What to beat today, in the member's own numbers. */
function progressionHint(name, iso){
  const last=lastPerformance(name, iso);
  if(!last) return null;
  const best=topSet(last.sets);
  if(!best) return null;
  const totalReps=last.sets.reduce((a,s)=>a+(Number(s.r)||0),0);
  return {when:shortDate(last.date), best:describeSet(best), totalReps,
          sets:last.sets.length};
}

/** Sessions actually trained vs training days that have gone by. */
function adherence(){
  const p=S.profile||{};
  const dates=Object.keys(S.sessions).sort();
  if(!dates.length) return null;
  const trained=dates.filter(d=>Object.keys(S.sessions[d].done||{}).length>=3);
  const start=p.startedOn || dates[0];
  let planned=0;
  const cur=parseISO(start), end=parseISO(todayISO());
  let guard=0;
  while(cur<=end && guard++<800){
    if(!isRestDay(p, cur.getDay())) planned++;
    cur.setDate(cur.getDate()+1);
  }
  return {trained:trained.length, planned:Math.max(planned,trained.length),
          pct: planned? Math.min(100, Math.round(trained.length/planned*100)) : 0,
          lastTrained: trained.length? trained[trained.length-1] : null};
}

/** Week number since the member started, 1-based. */
function programmeWeek(p){
  const start=(p && p.startedOn) || todayISO();
  return Math.floor(Math.max(0, daysBetween(start, todayISO()))/7) + 1;
}
/** Every fourth week, cut the volume. Opt out in Setup. */
function isDeloadWeek(p){
  if(!p || p.deload===false) return false;
  if(p.customPlan) return false;           // an uploaded plan sets its own volume
  return programmeWeek(p) % 4 === 0;
}

/* ================================================================
   MOTIVATION — streaks, records, milestones, the words on the wall
   Every number here is real. Nothing is inflated to feel good.
   ================================================================ */
function trainedOn(iso){
  const s=S.sessions[iso];
  return !!(s && Object.keys(s.done||{}).length>=3);
}
function isoDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return isoOf(d); }

/** Consecutive planned training days actually trained. Rest days don't break it.
    Today doesn't break it either — the day isn't over. */
function streakInfo(){
  const p=S.profile; if(!p) return {current:0,best:0};
  let current=0;
  for(let n=0;n<400;n++){
    const iso=isoDaysAgo(n), wd=parseISO(iso).getDay();
    if(isRestDay(p,wd)) continue;
    if(trainedOn(iso)) current++;
    else if(n===0) continue;         // today, still open
    else break;
  }
  // best: walk forward through history
  let best=0, run=0;
  const dates=Object.keys(S.sessions).sort();
  if(dates.length){
    const cur=parseISO(dates[0]), end=parseISO(todayISO()); let g=0;
    while(cur<=end && g++<800){
      const iso=isoOf(cur), wd=cur.getDay();
      if(!isRestDay(p,wd)){
        if(trainedOn(iso)){ run++; best=Math.max(best,run); }
        else if(iso!==todayISO()) run=0;
      }
      cur.setDate(cur.getDate()+1);
    }
  }
  return {current, best:Math.max(best,current)};
}

function sessionsTrainedCount(){ return Object.keys(S.sessions).filter(trainedOn).length; }

/** Status of each of the last 7 days, oldest first. */
function weekStrip(){
  const p=S.profile, out=[];
  for(let n=6;n>=0;n--){
    const iso=isoDaysAgo(n), wd=parseISO(iso).getDay();
    let state;
    if(isRestDay(p,wd)) state='rest';
    else if(trainedOn(iso)) state='trained';
    else if(n===0) state='today';
    else state='missed';
    out.push({iso, wd, state, label:DAYNAMES[wd].slice(0,1)});
  }
  return out;
}

/** Personal records set today: heavier top set, or more reps at the same weight. */
function recordsToday(){
  const iso=todayISO(), log=sessionLog(iso), out=[];
  for(const name of Object.keys(log)){
    const today=(log[name]||[]).filter(s=>s&&(s.w||s.r));
    if(!today.length) continue;
    const prior=[];
    Object.keys(S.sessions).filter(d=>d<iso).forEach(d=>{
      ((S.sessions[d].log||{})[name]||[]).forEach(s=>{ if(s&&(s.w||s.r)) prior.push(s); });
    });
    if(!prior.length) continue;              // first time is a baseline, not a record
    const bestNow=topSet(today), bestPrior=topSet(prior);
    const maxWPrior=Math.max(...prior.map(s=>Number(s.w)||0));
    const maxWNow=Math.max(...today.map(s=>Number(s.w)||0));
    let kind=null;
    if(maxWNow>maxWPrior) kind='heavier';
    else if(setVolume(bestNow)>setVolume(bestPrior)) kind='more work';
    else {
      // more reps at the previous top weight
      const atTop=today.filter(s=>Number(s.w)===maxWPrior).map(s=>Number(s.r)||0);
      const priorAtTop=prior.filter(s=>Number(s.w)===maxWPrior).map(s=>Number(s.r)||0);
      if(atTop.length && priorAtTop.length && Math.max(...atTop)>Math.max(...priorAtTop)) kind='more reps';
    }
    if(kind) out.push({name, kind, set:describeSet(bestNow), before:describeSet(bestPrior)});
  }
  return out;
}

const SESSION_MILESTONES=[1,3,5,10,20,30,50,75,100,150,200];
/** Milestones crossed by finishing today. */
function milestonesHit(prevSessions, nowSessions, prevKg, nowKg, targetKg){
  const hits=[];
  SESSION_MILESTONES.forEach(n=>{ if(prevSessions<n && nowSessions>=n)
    hits.push(n===1?'First session in the book.':`${n} sessions. That's a habit, not a phase.`); });
  [1,2.5,5].forEach(k=>{ if(prevKg<k && nowKg>=k) hits.push(`${k} kg of fat withdrawn on the ledger.`); });
  if(targetKg>0 && prevKg<targetKg/2 && nowKg>=targetKg/2) hits.push('Halfway to your goal weight.');
  return hits;
}

function greeting(){
  const h=new Date().getHours();
  return h<5?'Late night':h<12?'Good morning':h<17?'Good afternoon':'Good evening';
}

/** One honest line for the top of the workout tab, chosen by state. */
function heroLine(ses, isToday, doneN, totN){
  const p=S.profile, st=streakInfo();
  const yesterday=isoDaysAgo(1), yWd=parseISO(yesterday).getDay();
  const slippedYesterday=!isRestDay(p,yWd) && !trainedOn(yesterday) && Object.keys(S.sessions).some(d=>d<yesterday);
  if(!isToday) return `You're looking at ${DAYNAMES[viewDay]}. Today is what counts.`;
  if(ses.key==='rest') return 'Rest day. The work you did this week is being turned into something right now.';
  if(doneN>=totN && totN>0) return 'Done for today. Nothing else to prove until tomorrow.';
  if(doneN>0) return `${totN-doneN} sets left. Finish what you started.`;
  if(ses.deload) return 'Deload week. Lighter on purpose — show up, keep the weight, cut the sets.';
  if(slippedYesterday) return 'Yesterday slipped. Today puts it back. That is the whole game.';
  if(st.current>=7) return `${st.current} training days in a row. Don't hand that back.`;
  if(st.current>=3) return `${st.current} in a row. It's starting to look like you.`;
  const n=sessionsTrainedCount();
  if(n===0) return 'First one. Nobody remembers their first session being pretty.';
  return `${ses.minutes} minutes. Then it's done and you don't have to think about it.`;
}

/* ---------------- plan generation ---------------- */
function kitOf(profile){ return ['bodyweight',...(profile.equipment||[])]; }

function pickExercise(pattern, kit, seed, used){
  let cands = LIB.filter(x=>x.p===pattern && x.e.every(r=>kit.includes(r)));
  const fresh = cands.filter(x=>!used.has(x.n));
  if(fresh.length) cands = fresh;
  if(!cands.length) return null;
  const varied = pattern==='core'||pattern==='mobility'||pattern==='cardio';
  if(varied) return cands[Math.abs(seed)%cands.length];
  const top = Math.max(...cands.map(x=>x.t));
  const best = cands.filter(x=>x.t===top);
  return best[Math.abs(seed)%best.length];
}

/** Which template runs on a given weekday (0=Sun) for this member. */
function templateKeyFor(profile, weekday){
  const days = (profile.trainingDays||[]).slice().sort((a,b)=>a-b);
  const idx = days.indexOf(weekday);
  if(idx===-1) return 'rest';
  const split = SPLITS[days.length] || SPLITS[4];
  return split[idx % split.length];
}

function generateSession(profile, weekday, forceKey){
  const key = forceKey || templateKeyFor(profile, weekday);
  const tpl = TEMPLATES[key];
  const kit = kitOf(profile);
  const used = new Set();
  const exercises = [];
  const deload = isDeloadWeek(profile) && key!=='rest' && key!=='cond';
  tpl.slots.forEach((slot,i)=>{
    const ex = pickExercise(slot.p, kit, weekday*7+i, used);
    if(!ex) return;
    used.add(ex.n);
    let sets = slot.sets ?? ex.sets;
    let detail = slot.work ? `${sets} × ${slot.work} sec` : ex.d;
    // A deload trims the working sets. Warm-ups, finishers and mobility stay put.
    if(deload && (slot.ph==='Main'||slot.ph==='Circuit'||slot.ph==='Core')){
      const trimmed = Math.max(2, Math.round(sets*0.6));
      if(trimmed!==sets){
        sets = trimmed;
        // "4 × 12" becomes "2 × 12"; "8 minutes" is a duration and is left alone
        detail = slot.work ? `${sets} × ${slot.work} sec` : ex.d.replace(/^\d+(?=\s*×)/, String(sets));
      }
    }
    exercises.push({
      name:ex.n, phase:slot.ph||'Main', cue:ex.c, detail,
      sets, work:slot.work??ex.work, rest:slot.rest??ex.rest,
    });
  });
  const note = deload
    ? 'Deload week — volume is cut on purpose. Keep the weight, drop the sets. This is how you come back stronger rather than just more tired.'
    : tpl.note;
  return {key, name:tpl.name, focus:tpl.focus, note, met:tpl.met,
          minutes: deload?Math.round(tpl.minutes*0.75):tpl.minutes, exercises, deload};
}

/* Which week of an alternating plan are we in? Plans without a week column
   report 1 forever, which is exactly how they behaved before. */
function planWeekNumber(cp){
  const total = Math.max(1, cp.weeks || 1);
  if(total < 2) return 1;
  const start = (cp.uploadedAt || '').slice(0,10) || todayISO();
  let elapsed = 0;
  try{ elapsed = Math.floor(Math.max(0, daysBetween(start, todayISO())) / 7); }catch(e){}
  return ((elapsed + (cp.weekOffset || 0)) % total) + 1;
}

/* Week-specific session details override the ones shared by every week. */
function mergeMeta(D, wk){
  const base = D.meta[0] || {}, over = D.meta[wk] || {};
  const pick = (k, d) => {
    if(over[k] !== undefined && over[k] !== null && over[k] !== '') return over[k];
    if(base[k] !== undefined && base[k] !== null && base[k] !== '') return base[k];
    return d;
  };
  return {name:pick('name','Training'), focus:pick('focus',''),
          note:pick('note','From the plan you uploaded.'),
          met:pick('met',5), minutes:pick('minutes',null)};
}

function customDayExercises(d, wk){
  return d.exercises.filter(e => !e.w || e.w === wk);
}

/* An uploaded plan wins for the days it covers. Days it leaves out become recovery.
   With no uploaded plan, nothing changes — the generator runs exactly as before. */
function buildSession(profile, weekday){
  const cp = profile && profile.customPlan;
  if(cp && cp.days){
    const d = cp.days[weekday];
    if(d && d.meta){
      const wk = planWeekNumber(cp);
      const exercises = customDayExercises(d, wk);
      if(exercises.length){
        const m = mergeMeta(d, wk);
        const minutes = m.minutes || Math.max(10, Math.round(
          exercises.reduce((s,e)=>s + e.sets*((e.work||45)+e.rest), 0) / 60));
        return {key:'custom', name:m.name, focus:m.focus, note:m.note, met:m.met,
                minutes, exercises, week:wk, weeks:Math.max(1, cp.weeks||1)};
      }
    } else if(d && d.exercises && d.exercises.length){
      // a plan saved before week support existed — leave it exactly as it was
      return {key:'custom', name:d.name, focus:d.focus, note:d.note,
              met:d.met, minutes:d.minutes, exercises:d.exercises};
    }
    return generateSession(profile, weekday, 'rest');
  }
  return generateSession(profile, weekday, null);
}

function isRestDay(profile, weekday){
  const cp = profile && profile.customPlan;
  if(cp && cp.days){
    const d = cp.days[weekday];
    if(!d) return true;
    if(d.meta) return customDayExercises(d, planWeekNumber(cp)).length === 0;
    return !(d.exercises && d.exercises.length);
  }
  return templateKeyFor(profile, weekday)==='rest';
}

/* ---------------- CSV upload ---------------- */
const DAYKEYS={sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,
  thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
const INTENSITY={light:2.8,easy:2.8,moderate:5,medium:5,hard:6.5,tough:6.5,'very hard':7.5,intense:7.5};

/** RFC 4180 parser — handles quoted fields, embedded commas, and doubled quotes. */
function parseCSV(text){
  const rows=[]; let row=[], field='', inQuotes=false, i=0;
  text=String(text).replace(/^\uFEFF/,'');
  while(i<text.length){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQuotes=false;i++;continue; }
      field+=c;i++;continue;
    }
    if(c==='"'){inQuotes=true;i++;continue;}
    if(c===','){row.push(field);field='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);field='';rows.push(row);row=[];i++;continue;}
    field+=c;i++;
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

function planFromCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2) return {error:'That file has a header but no rows under it.'};
  const head=rows[0].map(h=>String(h).trim().toLowerCase().replace(/\s+/g,'_'));
  const col=n=>head.indexOf(n);
  const missing=['day','exercise'].filter(n=>col(n)===-1);
  if(missing.length) return {error:`Missing column${missing.length>1?'s':''}: ${missing.join(', ')}. Start from the template.`};
  const get=(r,n)=>{const i=col(n); return i===-1?'':String(r[i]==null?'':r[i]).trim();};

  const days={}, skipped=[];
  rows.slice(1).forEach((r,n)=>{
    const line=n+2;
    const raw=get(r,'day');
    const key=raw.toLowerCase();
    let wd = DAYKEYS[key];
    if(wd===undefined && /^[0-6]$/.test(key)) wd=+key;
    if(wd===undefined){ skipped.push(`row ${line} (“${raw||'blank'}” is not a day)`); return; }
    const name=get(r,'exercise');
    if(!name){ skipped.push(`row ${line} (no exercise name)`); return; }

    if(!days[wd]) days[wd]={meta:{}, exercises:[]};
    const D=days[wd];

    // week 0 means "every week" — a file with no week column is entirely week 0
    let wk=parseInt(get(r,'week'),10);
    wk = (wk>0) ? Math.min(wk,12) : 0;
    if(!D.meta[wk]) D.meta[wk]={name:'',focus:'',note:'',met:null,minutes:null};
    const M=D.meta[wk];

    if(!M.name  && get(r,'session')) M.name=get(r,'session');
    if(!M.focus && get(r,'focus'))   M.focus=get(r,'focus');
    if(!M.note  && get(r,'note'))    M.note=get(r,'note');
    if(M.met==null){
      const it=get(r,'intensity').toLowerCase();
      if(INTENSITY[it]!=null) M.met=INTENSITY[it];
      else { const m=parseFloat(get(r,'met')); if(m>0&&m<20) M.met=m; }
    }
    if(M.minutes==null){ const mm=parseInt(get(r,'minutes'),10); if(mm>0&&mm<400) M.minutes=mm; }

    let sets=parseInt(get(r,'sets'),10); if(!(sets>0)) sets=1; sets=Math.min(sets,20);
    let work=parseInt(get(r,'seconds'),10); work=(work>0)?Math.min(work,3600):null;
    let rest=parseInt(get(r,'rest'),10); rest=(rest>0)?Math.min(rest,600):0;
    const reps=get(r,'reps'), load=get(r,'load');
    let detail = reps ? `${sets} × ${reps}` : (work ? `${sets} × ${work} sec` : `${sets} set${sets>1?'s':''}`);
    if(load) detail += ` · ${load}`;

    D.exercises.push({name, phase:get(r,'phase')||'Main', cue:get(r,'cue')||'', detail, sets, work, rest, w:wk});
  });

  const keys=Object.keys(days);
  if(!keys.length) return {error:'No usable rows found. '+(skipped.slice(0,2).join('; ')||'')};

  let weeks=1;
  keys.forEach(k=>{
    Object.keys(days[k].meta).forEach(wk=>{ if(+wk > weeks) weeks = +wk; });
  });

  return {days, skipped, weeks, dayCount:keys.length,
    exCount:keys.reduce((s,k)=>s+days[k].exercises.length,0)};
}

const totalSets = s => s.exercises.reduce((a,e)=>a+e.sets,0);
const sessionBurn = (s,w,f=1) => s.met*3.5*(w||75)/200*s.minutes*f;

function maintenanceFor(p){
  const w=+p.startWeight||75, h=+p.height||170, a=+p.age||33;
  const bmr = 10*w + 6.25*h - 5*a + (p.sex==='female'?-161:5);
  const n=(p.trainingDays||[]).length;
  const factor = n>=6?1.50 : n===5?1.46 : n===4?1.42 : 1.375;
  return Math.round(bmr*factor);
}

async function api(path, opts={}){
  const user = window.netlifyIdentity.currentUser();
  if(!user) throw new Error('signed out');
  const token = await user.jwt();
  const res = await fetch(path, {
    ...opts,

function setStatus(msg, isErr){
  document.querySelectorAll('.status').forEach(el=>{
    el.textContent = msg; el.classList.toggle('err', !!isErr);
  });
  if(msg) setTimeout(()=>{document.querySelectorAll('.status').forEach(el=>{

  })}, 2200);

function queueSave(){
  // local mirror first so nothing is lost if the network drops mid-session
  try{ localStorage.setItem(lsKey(), JSON.stringify(S)); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{

      if(res.ok) setStatus('Saved'); else setStatus('Save failed', true);
    }catch(e){ setStatus('Offline — kept on this device', true); }

}

function beep(times=1, freq=880){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    if(!audioCtx) audioCtx = new Ctx();
    if(audioCtx.state==='suspended') audioCtx.resume();
    for(let i=0;i<times;i++){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination); o.type='sine'; o.frequency.value=freq;
      const t=audioCtx.currentTime+i*0.26;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.28,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.start(t); o.stop(t+0.26);
    }
  }catch(e){}
}

/* ================================================================
   LEDGER MATH
   ================================================================ */
function model(){
  const p=S.profile||{}, dates=Object.keys(S.entries).sort();
  const targetKg=Math.max((+p.startWeight||75)-(+p.goalWeight||68),0.1);
  const targetKcal=targetKg*7700;
  let lastW=+p.startWeight||75, cum=0; const rows=[];
  for(const d of dates){
    const e=S.entries[d];
    if(e.weight!=null) lastW=e.weight;
    const maint=(+p.maintenance||2400)*(lastW/(+p.startWeight||75));
    const burn=e.burn||0;
    const deficit = (p.mode==='full' && e.intake!=null) ? maint+burn-e.intake : burn;
    cum+=deficit;
    rows.push({date:d,label:shortDate(d),weight:e.weight,waist:e.waist??null,burn,intake:e.intake,deficit,cum});
  }
  const weighed=rows.filter(r=>r.weight!=null);
  weighed.forEach((r,i)=>{const win=weighed.slice(Math.max(0,i-6),i+1);
    r.trend=win.reduce((s,x)=>s+x.weight,0)/win.length;});
  if(rows.length){const first=rows[0].date;
    rows.forEach(r=>{r.plan=(daysBetween(first,r.date)+1)*(+p.dailyTarget||500);});}

  const first=dates[0]||null;
  const calDays=first?daysBetween(first,todayISO())+1:0;
  const pace=calDays>0?cum/calDays:0;
  const remaining=Math.max(targetKcal-cum,0);
  const pct=Math.min(cum/targetKcal*100,100);
  const trend=weighed.length?weighed[weighed.length-1].trend:null;
  const current=weighed.length?weighed[weighed.length-1].weight:(+p.startWeight||75);
  let eta=null,etaDays=null;
  if(pace>20&&remaining>0){etaDays=Math.ceil(remaining/pace);
    const d=new Date(); d.setDate(d.getDate()+etaDays); eta=d;}
  const tr=S.entries[todayISO()];
  const todayDef = tr ? ((p.mode==='full'&&tr.intake!=null)
    ? (+p.maintenance||2400)*((tr.weight??lastW)/(+p.startWeight||75))+(tr.burn||0)-tr.intake
    : (tr.burn||0)) : 0;
  const waists=rows.filter(r=>r.waist!=null);
  const waist=waists.length?waists[waists.length-1].waist:null;
  const waistChange=waists.length>1?waist-waists[0].waist:null;

  return {rows,targetKcal,cum,pct,ledgerKg:cum/7700,
    scaleKg:trend!=null?(+p.startWeight||75)-trend:null,current,waist,waistChange,
    remaining,pace,calDays,logged:dates.length,eta,etaDays,todayDef};
}

/* ================================================================
   SVG CHARTS
   ================================================================ */
function svgChart(rows, kind, goal, dailyTarget){
  const W=560,H=210,PL=44,PR=10,PT=12,PB=26;
  if(rows.length<2) return '';
  const iw=W-PL-PR, ih=H-PT-PB;
  const xs = i => PL + (rows.length===1?iw/2:iw*i/(rows.length-1));
  let vals, min, max;
  if(kind==='weight'){
    vals = rows.map(r=>r.weight).filter(v=>v!=null);
    if(vals.length<2) return '';
    min=Math.min(...vals,goal)-0.6; max=Math.max(...vals,goal)+0.6;
  }else{
    vals = rows.map(r=>r.cum).concat(rows.map(r=>r.plan||0));
    min=0; max=Math.max(...vals,1)*1.05;
  }
  const ys = v => PT + ih - ih*(v-min)/((max-min)||1);
  const ticks=[0,.25,.5,.75,1].map(t=>min+(max-min)*t);
  let out=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(t=>{out+=`<line class="grid" x1="${PL}" x2="${W-PR}" y1="${ys(t).toFixed(1)}" y2="${ys(t).toFixed(1)}"/>`;
    out+=`<text class="axis" x="4" y="${(ys(t)+3).toFixed(1)}">${kind==='weight'?t.toFixed(1):(t>=1000?(t/1000).toFixed(0)+'k':t.toFixed(0))}</text>`;});
  const step=Math.max(1,Math.ceil(rows.length/6));
  rows.forEach((r,i)=>{ if(i%step===0||i===rows.length-1)
    out+=`<text class="axis" x="${xs(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(r.label)}</text>`; });

  if(kind==='weight'){
    out+=`<line class="goal" x1="${PL}" x2="${W-PR}" y1="${ys(goal).toFixed(1)}" y2="${ys(goal).toFixed(1)}"/>`;
    rows.forEach((r,i)=>{ if(r.weight!=null)
      out+=`<circle class="dot" cx="${xs(i).toFixed(1)}" cy="${ys(r.weight).toFixed(1)}" r="3"/>`; });
    const tp=rows.map((r,i)=>r.trend!=null?`${xs(i).toFixed(1)},${ys(r.trend).toFixed(1)}`:null).filter(Boolean);
    if(tp.length>1) out+=`<polyline class="trend" points="${tp.join(' ')}"/>`;
  }else{
    const cp=rows.map((r,i)=>`${xs(i).toFixed(1)},${ys(r.cum).toFixed(1)}`);
    out+=`<polygon class="cumarea" points="${xs(0).toFixed(1)},${ys(min).toFixed(1)} ${cp.join(' ')} ${xs(rows.length-1).toFixed(1)},${ys(min).toFixed(1)}"/>`;
    out+=`<polyline class="cumline" points="${cp.join(' ')}"/>`;
    const pp=rows.map((r,i)=>`${xs(i).toFixed(1)},${ys(r.plan||0).toFixed(1)}`);
    out+=`<polyline class="planline" points="${pp.join(' ')}"/>`;
  }
  return out+'</svg>';
}

/* ================================================================
   TIMER
   ================================================================ */
let timer=null, tickHandle=null;

function announce(msg){
  const el=document.getElementById('announce');
  if(el) el.textContent=msg;
}

function startTimer(t){
  timer=t; renderTimer();
  announce(t.mode==='work'?`Work, ${Math.round(t.total)} seconds`:`Rest, ${Math.round(t.total)} seconds`);
  clearInterval(tickHandle);
  tickHandle=setInterval(()=>{
    if(!timer){clearInterval(tickHandle);return;}
    if(timer.endsAt-Date.now()<=0){ clearInterval(tickHandle); finishTimer(); }
    else updateTimerFace();
  },200);
}
function stopTimer(){ timer=null; clearInterval(tickHandle); refresh(); }

function finishTimer(){
  const t=timer; if(!t) return;
  const ses=buildSession(S.profile, viewDay);
  const ex=ses.exercises[t.ex];
  if(t.mode==='work'){
    if(ex) markSet(ex.name,t.set,true,true);
    beep(2,940);
    if(ex && ex.rest>0 && t.set<ex.sets-1){
      startTimer({ex:t.ex,set:t.set,mode:'rest',endsAt:Date.now()+ex.rest*1000,total:ex.rest});
      refresh(); return;
    }
  }else{ beep(3,620); announce('Rest over. Next set.'); }
  timer=null;
  // in the player, rolling off the last set moves you on rather than stranding you
  if(player && ex){
    const done=(S.sessions[todayISO()]?.done)||{};
    if(nextSetIndex(ex, t.ex, done)>=ex.sets && ses.exercises[t.ex+1]) player.ex=t.ex+1;
  }
  refresh();
}

function updateTimerFace(){
  if(!timer) return;
  const left=(timer.endsAt-Date.now())/1000;
  const pct=Math.max(0,Math.min(100,left/timer.total*100));
  ['timernum','ptimernum'].forEach(id=>{const n=document.getElementById(id); if(n) n.textContent=clock(left);});
  ['timerfill','ptimerfill'].forEach(id=>{const f=document.getElementById(id); if(f) f.style.width=pct+'%';});
}

function renderTimer(){
  const host=document.getElementById('timerhost'); if(!host) return;
  if(!timer){host.innerHTML=''; return;}
  const ses=buildSession(S.profile, viewDay);
  const ex=ses.exercises[timer.ex];
  host.innerHTML=`<div class="timerbar ${timer.mode}">
    <div class="timerinfo">
      <span class="timerlabel">${timer.mode==='work'?'Work':'Rest'}</span>
      <span class="timerex">${esc(ex?ex.name:'')}</span>
    </div>
    <div class="timernum" id="timernum">${clock((timer.endsAt-Date.now())/1000)}</div>
    <div class="timeract">
      <button class="ghost" data-act="timer-stop">Stop</button>
      <button class="ghost" data-act="timer-skip">Skip</button>
    </div>
    <div class="timertrack"><div class="timerfill" id="timerfill" style="width:100%"></div></div>
  </div>`;
}

/* ================================================================

   ================================================================ */
function markSet(name,setIdx,value,silent){
  const iso=todayISO();
  const cur=S.sessions[iso]||{done:{}};
  if(!cur.done) cur.done={};
  const key=setKey(name,setIdx);
  if(value) cur.done[key]=true; else delete cur.done[key];
  S.sessions[iso]=cur;
  queueSave();
  if(!silent) refresh();
}

/* ---------------- undo ---------------- */
function exerciseHasProgress(iso, exIdx, name){
  const s=S.sessions[iso]; if(!s) return false;
  const ticked=Object.keys(s.done||{}).some(k=>k.startsWith(name+'::'));
  const logged=!!((s.log||{})[name]||[]).some(Boolean);
  return ticked||logged;
}
function resetExercise(iso, exIdx, name){
  const s=S.sessions[iso]; if(!s) return;
  Object.keys(s.done||{}).forEach(k=>{ if(k.startsWith(name+'::')) delete s.done[k]; });
  if(s.log) delete s.log[name];
  if(timer && timer.ex===exIdx){ timer=null; clearInterval(tickHandle); }
  queueSave();
}
function resetToday(){
  const iso=todayISO();
  delete S.sessions[iso];
  timer=null; clearInterval(tickHandle);
  queueSave();
}

/** This week against last week: the comparison that keeps people going in week three. */
function weekOverWeek(){
  const win=(from,to)=>{
    const days=[]; for(let n=from;n<to;n++) days.push(isoDaysAgo(n));
    const ws=days.map(d=>S.entries[d]?.weight).filter(v=>v!=null);
    const wa=days.map(d=>S.entries[d]?.waist).filter(v=>v!=null);
    return {
      weight: ws.length? ws.reduce((a,b)=>a+b,0)/ws.length : null,
      waist:  wa.length? wa.reduce((a,b)=>a+b,0)/wa.length : null,
      trained: days.filter(trainedOn).length,
      burned: days.reduce((a,d)=>a+((S.entries[d]?.burn)||0),0),
      sets: days.reduce((a,d)=>a+Object.keys((S.sessions[d]?.done)||{}).length,0),
    };
  };
  const now=win(0,7), prev=win(7,14);
  const has=Object.keys(S.entries).length+Object.keys(S.sessions).length>0;
  return has?{now,prev}:null;
}

document.addEventListener('click', async (ev)=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;

  if(act==='tab'){ tab=el.dataset.t; panel=null; confirmReset=false; confirmWipe=false; render(); try{ window.scrollTo({top:0}); }catch(e){} return; }
  if(act==='day'){ viewDay=+el.dataset.i; timer=null; clearInterval(tickHandle); render(); return; }
  if(act==='panel'){ panel = panel===el.dataset.p ? null : el.dataset.p; render(); return; }
  if(act==='signout'){ window.netlifyIdentity.logout(); return; }
  if(act==='reload-members'){ membersCache=null; render(); return; }

  if(act==='go-today'){ viewDay=new Date().getDay(); timer=null; clearInterval(tickHandle); render(); return; }
  if(act==='ledger-today'){ ledgerDate=null; render(); return; }
  if(act==='clear-form'){
    ['f-weight','f-waist','f-burn','f-intake','f-note'].forEach(id=>{const e=document.getElementById(id); if(e) e.value='';});
    setStatus('Cleared'); return;
  }

  if(act==='ask-reset'){ confirmReset=true; render(); return; }
  if(act==='cancel-reset'){ confirmReset=false; render(); return; }
  if(act==='reset-today'){ confirmReset=false; resetToday(); render(); setStatus('Today cleared'); return; }
  if(act==='reset-ex'){
    resetExercise(todayISO(), +el.dataset.ex, el.dataset.name);
    refresh(); setStatus('Reset'); return;
  }
  if(act==='clear-log'){
    recordSet(todayISO(), el.dataset.name, +el.dataset.set, {w:'', r:''});
    refresh(); return;
  }

  if(act==='toggle-deload'){
    S.profile.deload = S.profile.deload===false;
    queueSave(); render(); return;
  }
  if(act==='theme'){
    S.profile.theme = el.dataset.k;
    applyTheme(); queueSave(); render(); return;
  }

  if(act==='change-password'){
    const a=document.getElementById('pw1').value, b=document.getElementById('pw2').value;
    if(a.length<8){ setStatus('Use at least 8 characters', true); return; }
    if(a!==b){ setStatus("Those two don't match", true); return; }
    const user=window.netlifyIdentity.currentUser();
    if(!user){ setStatus('Sign in again first', true); return; }
    setStatus('Changing…');
    user.update({password:a})
      .then(()=>{ document.getElementById('pw1').value=''; document.getElementById('pw2').value='';
                  setStatus('Password changed'); })
      .catch(err=>setStatus(err && err.message ? err.message : 'Could not change it', true));
    return;
  }

  if(act==='ask-delete'){ confirmWipe=true; render(); return; }
  if(act==='cancel-delete'){ confirmWipe=false; render(); return; }
  if(act==='delete-data'){
    confirmWipe=false;
    setStatus('Deleting…');
    try{
      const res=await api('/api/data',{method:'DELETE'});
      if(!res.ok) throw new Error('failed');
      try{ localStorage.removeItem(lsKey()); }catch(e){}
      S={profile:null, entries:{}, sessions:{}};
      tab='workout'; render(); setStatus('Deleted');
    }catch(e){ render(); setStatus('Delete failed, try again', true); }
    return;
  }

  if(act==='player-open'){
    const ses=buildSession(S.profile, viewDay);
    openPlayer(firstUnfinished(ses, (S.sessions[todayISO()]?.done)||{}));
    return;
  }
  if(act==='player-close'){ timer=null; clearInterval(tickHandle); closePlayer(); return; }
  if(act==='player-prev'){ timer=null; clearInterval(tickHandle); player.ex=Math.max(0,player.ex-1); renderPlayer(); return; }
  if(act==='player-next'){ timer=null; clearInterval(tickHandle); player.ex=player.ex+1; renderPlayer(); return; }
  if(act==='player-done'){ completeSession(); return; }
  if(act==='done-close'){ const b=document.getElementById('doneshell'); if(b) b.remove(); return; }

  if(act==='player-go'){
    const ses=buildSession(S.profile, viewDay);
    const i=player.ex, ex=ses.exercises[i];
    const done=(S.sessions[todayISO()]?.done)||{};
    const s=nextSetIndex(ex,i,done);
    if(s>=ex.sets) return;
    if(ex.work){ beep(1,1100); startTimer({ex:i,set:s,mode:'work',endsAt:Date.now()+ex.work*1000,total:ex.work}); }
    else{
      markSet(ex.name,s,true,true);
      if(navigator.vibrate) navigator.vibrate(18);
      if(ex.rest>0 && s<ex.sets-1) startTimer({ex:i,set:s,mode:'rest',endsAt:Date.now()+ex.rest*1000,total:ex.rest});
      else if(ses.exercises[i+1] && s>=ex.sets-1) player.ex=i+1;
    }
    renderPlayer();
    return;
  }

  if(act==='player-set'){
    const ses=buildSession(S.profile, viewDay);
    const i=player.ex, s=+el.dataset.set;
    const done=(S.sessions[todayISO()]?.done)||{};
    const exn=ses.exercises[i].name;
    markSet(exn,s,!done[setKey(exn,s)],true);
    timer=null; clearInterval(tickHandle);
    renderPlayer();
    return;
  }

  if(act==='zoom'){
    const folder=el.dataset.folder, name=el.dataset.name, enc=encodeURIComponent(folder);
    const box=document.createElement('div');
    box.className='lightbox';
    box.innerHTML=`<div class="lbinner">
      <h4>${esc(name)}</h4>
      <div class="lbshots">
        <figure><img src="${IMG_CDN}${enc}/0.jpg" alt="${esc(name)}, start position"><figcaption>Start</figcaption></figure>
        <figure><img src="${IMG_CDN}${enc}/1.jpg" alt="${esc(name)}, end position"><figcaption>End</figcaption></figure>
      </div>
      <button class="ghost">Close</button>
    </div>`;
    const shut=()=>box.remove();
    box.addEventListener('click',shut);
    document.body.appendChild(box);
    return;
  }

  if(act==='week-flip'){
    const cp=S.profile.customPlan;
    if(cp){ cp.weekOffset=(cp.weekOffset||0)+1; queueSave(); timer=null; clearInterval(tickHandle); render(); }
    return;
  }

  if(act==='clear-plan'){
    if(S.profile.customPlan){ delete S.profile.customPlan; queueSave(); }
    csvNote={text:'Back on the generated plan.',err:false};
    render(); return;
  }

  if(act==='equip'||act==='trainday'){
    el.classList.toggle('on'); return; // read at save time
  }

  if(act==='timer-stop'){ stopTimer(); return; }
  if(act==='timer-skip'){ finishTimer(); return; }

  if(act==='set'){
    const exIdx=+el.dataset.ex, setIdx=+el.dataset.set;
    const ses=buildSession(S.profile,viewDay);
    const ex=ses.exercises[exIdx];
    const iso=todayISO();
    const isDone=!!(S.sessions[iso]?.done||{})[setKey(ex.name,setIdx)];
    if(isDone){ markSet(ex.name,setIdx,false); return; }
    if(ex.work){ beep(1,1100); startTimer({ex:exIdx,set:setIdx,mode:'work',endsAt:Date.now()+ex.work*1000,total:ex.work}); render(); }
    else{
      markSet(ex.name,setIdx,true,true);
      if(ex.rest>0&&setIdx<ex.sets-1) startTimer({ex:exIdx,set:setIdx,mode:'rest',endsAt:Date.now()+ex.rest*1000,total:ex.rest});
      render();
    }
    return;
  }

  if(act==='finish'){ completeSession(); return; }

  if(act==='save-day'){
    const date=document.getElementById('f-date').value||todayISO();
    const wv=document.getElementById('f-weight').value;
    const wa=document.getElementById('f-waist').value;
    const bv=document.getElementById('f-burn').value;
    const iv=document.getElementById('f-intake')?.value;
    const nv=document.getElementById('f-note').value;
    if(wv===''&&bv===''&&wa===''&&(iv===undefined||iv==='')){ setStatus('Add a weight or a burn first',true); return; }
    S.entries[date]={
      weight: wv===''?null:parseFloat(wv),
      waist: wa===''?null:parseFloat(wa),
      burn: bv===''?0:parseFloat(bv),
      intake: (iv===undefined||iv==='')?null:parseFloat(iv),
      note: (nv||'').trim(),
    };
    queueSave(); render(); setStatus('Saved');
    return;
  }

  if(act==='del-day'){ delete S.entries[el.dataset.d]; queueSave(); render(); return; }

  if(act==='save-profile'){
    const equipment=[...document.querySelectorAll('#p-equip button.on')].map(b=>b.dataset.k);
    const trainingDays=[...document.querySelectorAll('#p-days button.on')].map(b=>+b.dataset.i);
    const start=parseFloat(document.getElementById('p-start').value);
    const goal=parseFloat(document.getElementById('p-goal').value);
    if(!start||!goal){ setStatus('Fill in your current and goal weight',true); return; }
    if(goal>=start){ setStatus('Goal weight should be below your current weight',true); return; }
    if(!trainingDays.length){ setStatus('Pick at least one training day',true); return; }
    const p={
      name:document.getElementById('p-name').value.trim(),
      sex:document.getElementById('p-sex').value,
      age:parseInt(document.getElementById('p-age').value)||33,
      height:parseInt(document.getElementById('p-height').value)||170,
      startWeight:start, goalWeight:goal,
      dailyTarget:parseInt(document.getElementById('p-target').value)||500,
      mode:document.getElementById('p-mode').value,
      equipment, trainingDays,
      startedOn: (S.profile && S.profile.startedOn) || todayISO(),
      deload: S.profile ? S.profile.deload !== false : true,
      customPlan: S.profile && S.profile.customPlan,
    };
    if(!p.customPlan) delete p.customPlan;
    p.maintenance=maintenanceFor(p);
    S.profile=p; queueSave(); tab='workout'; viewDay=new Date().getDay(); render(); setStatus('Saved');
    return;
  }
});

document.addEventListener('change', async (ev)=>{
  if(ev.target.id==='f-date'){
    const v=ev.target.value;
    ledgerDate = (v && v!==todayISO()) ? v : null;
    render(); return;
  }
  if(ev.target.classList && ev.target.classList.contains('plogin')){
    const t=ev.target;
    recordSet(todayISO(), t.dataset.name, +t.dataset.set, {[t.dataset.log]: t.value});
    return;
  }
  if(ev.target.id!=='csv-input') return;
  const file=ev.target.files && ev.target.files[0];
  ev.target.value='';
  if(!file) return;
  if(file.size>2_000_000){ csvNote={text:'That file is too big. A plan should be a few kilobytes.',err:true}; render(); return; }

  let text;
  try{ text=await file.text(); }
  catch(e){ csvNote={text:"Couldn't read that file.",err:true}; render(); return; }

  const res=planFromCSV(text);
  if(res.error){ csvNote={text:res.error,err:true}; render(); return; }

  S.profile.customPlan={
    days:res.days, weeks:res.weeks || 1, weekOffset:0,
    dayCount:res.dayCount, exCount:res.exCount,
    fileName:file.name, uploadedAt:new Date().toISOString(),
  };
  // The Setup toggles should say what the plan says, not what was chosen before it.
  S.profile.trainingDays=Object.keys(res.days).map(Number).sort((a,b)=>a-b);
  queueSave();
  csvNote={
    text:`Loaded ${res.exCount} exercises across ${res.dayCount} days`+
      ((res.weeks||1)>1?`, alternating over ${res.weeks} weeks.`:'.')+
      (res.skipped.length?` Skipped ${res.skipped.length} row${res.skipped.length>1?'s':''}: ${res.skipped.slice(0,3).join(', ')}${res.skipped.length>3?'…':''}`:''),
    err:false,
  };
  viewDay=new Date().getDay();
  timer=null; clearInterval(tickHandle);
  render();
});

document.addEventListener('keydown', (ev)=>{
  if(ev.key==='Escape'){
    const lb=document.querySelector('.lightbox'); if(lb){ lb.remove(); return; }
    if(player){ timer=null; clearInterval(tickHandle); closePlayer(); return; }
  }
  if(ev.key!=='Enter' || ev.target.tagName==='TEXTAREA' || ev.target.tagName==='BUTTON') return;
  if(ev.target.closest('#ledger-form')){ ev.preventDefault(); const b=document.querySelector('[data-act="save-day"]'); if(b) b.click(); }
  else if(ev.target.closest('#p-equip, #p-days') === null && ev.target.id && ev.target.id.startsWith('p-')){
    ev.preventDefault(); const b=document.querySelector('[data-act="save-profile"]'); if(b) b.click(); }
  else if(ev.target.id==='pw1'||ev.target.id==='pw2'){ ev.preventDefault(); const b=document.querySelector('[data-act="change-password"]'); if(b) b.click(); }
});

/* ================================================================
   BOOT
   ================================================================ */
document.getElementById('signin').addEventListener('click',()=>window.netlifyIdentity.open('login'));
document.getElementById('forgot').addEventListener('click',()=>{
  // The widget's own login pane carries the "Forgot password?" link that sends the email.
  window.netlifyIdentity.open('login');
});

/* Netlify emails send people back here with a token in the URL fragment.
   The widget reads it on init and shows the right form — but only if the
   fragment survives, so open it explicitly rather than relying on timing. */
function handleAuthLink(){
  const hash=window.location.hash||'';
  if(hash.indexOf('recovery_token=')>-1){ window.netlifyIdentity.open('login'); return true; }
  if(hash.indexOf('invite_token=')>-1){ window.netlifyIdentity.open('signup'); return true; }
  if(hash.indexOf('confirmation_token=')>-1){ window.netlifyIdentity.open('login'); return true; }
  if(hash.indexOf('error=')>-1){
    // an expired or already-used link
    const note=document.querySelector('.gate-note');
    if(note) note.textContent='That link has expired or was already used. Ask for a new one with "Forgot your password?" above.';
    return true;
  }
  return false;
}

async function boot(){
  const user=window.netlifyIdentity.currentUser();
  if(!user){ gate.classList.remove('hidden'); root.classList.add('hidden'); return; }
  ME.id=user.id; ME.email=user.email;
  ME.isAdmin=Array.isArray(user.app_metadata?.roles)&&user.app_metadata.roles.includes('admin');
  gate.classList.add('hidden'); root.classList.remove('hidden');
  root.innerHTML='<p class="caption" style="padding:40px 0">Opening your plan…</p>';

  // Exercise photos are a nice-to-have: if this fails, the app runs without them.
  if(!IMG_MAP){
    try{
      const r=await fetch('/exercise-images.json');
      if(r.ok) IMG_MAP=await r.json();
    }catch(e){ IMG_MAP=null; }
  }

  let fromServer = false;
  try{
    const res=await api('/api/data');
    if(!res.ok) throw new Error('storage unreachable');
    const body=await res.json();
    if(body.data){
      S={profile:body.data.profile&&Object.keys(body.data.profile).length?body.data.profile:null,
         entries:body.data.entries||{}, sessions:body.data.sessions||{}};
    }
    if(typeof body.isAdmin==='boolean') ME.isAdmin=body.isAdmin;
    fromServer=true;
  }catch(e){}

  // Only reach for the local copy if the server genuinely could not answer. A real
  // empty account must still show onboarding rather than resurrecting stale data.
  if(!fromServer){
    try{ const local=localStorage.getItem(lsKey()); if(local) S=JSON.parse(local); }catch(_){}
  }
  migrateDoneKeys();
  render();
  if(!fromServer) setStatus('Offline — showing your last saved copy', true);
}

window.netlifyIdentity.on('init', ()=>{ handleAuthLink(); boot(); });
window.netlifyIdentity.on('login', ()=>{ window.netlifyIdentity.close(); boot(); });
window.netlifyIdentity.on('logout', ()=>{ S={profile:null,entries:{},sessions:{}}; location.reload(); });
window.netlifyIdentity.init();
</script>
